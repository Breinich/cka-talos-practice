# Example for the default scope only; substitute the active namespace and prefix.
resources:
- ../base
namespace: cka-practice
namePrefix: cka-practice-
labels:
- pairs:
    cka-lab.io/owner: cka-talos-practice
  includeTemplates: true
patches:
- target: {kind: Deployment, name: kustom-app}
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
