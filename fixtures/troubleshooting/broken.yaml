apiVersion: apps/v1
kind: Deployment
metadata:
  name: sable-view
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T01}
spec:
  replicas: 1
  selector: {matchLabels: {app: sable-view}}
  template:
    metadata: {labels: {app: sable-view, cka-lab.io/owner: cka-talos-practice}}
    spec:
      containers:
      - name: web
        image: nginx:no-such-cka-tag
        resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sable-probe
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T02}
spec:
  replicas: 1
  selector: {matchLabels: {app: sable-probe}}
  template:
    metadata: {labels: {app: sable-probe, cka-lab.io/owner: cka-talos-practice}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        readinessProbe: {httpGet: {path: /, port: 81}, initialDelaySeconds: 1, periodSeconds: 2}
        resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: sable-worker
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T03}
spec:
  nodeSelector: {cka-lab.io/nonexistent: "true"}
  containers:
  - name: sleeper
    image: busybox:1.36
    command: [sh, -c, "sleep 7d"]
    resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: sable-route
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T04}
spec:
  selector: {app: wrong-selector}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-stray
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T05}
spec:
  dnsPolicy: None
  dnsConfig: {nameservers: [192.0.2.53]}
  containers:
  - name: resolver
    image: busybox:1.36
    command: [sh, -c, 'sleep 7d']
    resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-churn
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T06}
spec:
  replicas: 1
  selector: {matchLabels: {app: log-churn}}
  template:
    metadata: {labels: {app: log-churn, cka-lab.io/owner: cka-talos-practice}}
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: [sh, -c, 'echo "ledger-worker: startup rejected (exit 17)"; exit 17']
        resources: {requests: {cpu: 5m, memory: 8Mi}}
