apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T01}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image, cka-lab.io/owner: cka-talos-practice}}
    spec:
      containers:
      - name: web
        image: nginx:no-such-cka-tag
        resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-ready
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T02}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-ready}}
  template:
    metadata: {labels: {app: broken-ready, cka-lab.io/owner: cka-talos-practice}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        readinessProbe: {httpGet: {path: /, port: 81}, initialDelaySeconds: 1, periodSeconds: 2}
        resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: unschedulable
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T03}
spec:
  nodeSelector: {cka-lab.io/nonexistent: "true"}
  containers:
  - name: sleeper
    image: busybox:1.36
    command: [sh, -c, "sleep 7d"]
    resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: broken-service
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/task: T04}
spec:
  selector: {app: wrong-selector}
  ports: [{port: 80, targetPort: 80}]
