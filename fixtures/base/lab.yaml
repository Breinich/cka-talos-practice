apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-info
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
data:
  purpose: safe-cka-practice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, cka-lab.io/owner: cka-talos-practice}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: __NAMESPACE__
  labels: {app: toolbox, cka-lab.io/owner: cka-talos-practice}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: toolbox
    image: busybox:1.36
    command: [sh, -c, "trap : TERM INT; sleep 7d & wait"]
    resources:
      requests: {cpu: 5m, memory: 8Mi}
      limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-identity
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relay-reader
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relay-reader
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
subjects:
- kind: ServiceAccount
  name: relay-identity
  namespace: __NAMESPACE__
roleRef: {kind: Role, name: relay-reader, apiGroup: rbac.authorization.k8s.io}
