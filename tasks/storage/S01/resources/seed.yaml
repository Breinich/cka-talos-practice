apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: S01
  name: lighthouse-workspace
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lighthouse-workspace
  template:
    metadata:
      labels:
        app: lighthouse-workspace
        cka-lab.io/owner: cka-talos-practice
        cka-lab.io/task: S01
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep 7d
        image: busybox:1.36
        name: producer
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
        volumeMounts:
        - mountPath: /workspace
          name: workspace
      - command:
        - sh
        - -c
        - sleep 7d
        image: busybox:1.36
        name: consumer
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
      volumes:
      - emptyDir: {}
        name: workspace
