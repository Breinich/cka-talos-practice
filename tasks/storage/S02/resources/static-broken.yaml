# Offline input only. Never apply to the Talos cluster.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: __PREFIX__-lighthouse-archive
  labels: {cka-lab.io/owner: cka-talos-practice, cka-lab.io/prefix: __PREFIX__}
spec:
  capacity: {storage: 256Mi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: {path: /var/local/lighthouse-archive, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lighthouse-archive
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: __PREFIX__-lighthouse-archive
  resources: {requests: {storage: 512Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: lighthouse-reader
  namespace: __NAMESPACE__
  labels: {cka-lab.io/owner: cka-talos-practice}
spec:
  containers:
  - name: reader
    image: busybox:1.36
    command: [sh, -c, "sleep 7d"]
    volumeMounts: [{name: archive, mountPath: /archive}]
  volumes: [{name: archive, persistentVolumeClaim: {claimName: wrong-archive}}]
