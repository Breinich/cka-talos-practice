# Offline starting point only: do not apply this sample as-is.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ember-autoscale
  labels: {cka-lab.io/owner: cka-talos-practice}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ember-autoscale}
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 80}
