apiVersion: v1
kind: Service
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: W06
  name: ember-ledger
  namespace: __NAMESPACE__
spec:
  clusterIP: None
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: ember-ledger
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: W06
  name: ember-ledger
  namespace: __NAMESPACE__
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ember-ledger
  serviceName: ember-ledger
  template:
    metadata:
      labels:
        app: ember-ledger
        cka-lab.io/owner: cka-talos-practice
        cka-lab.io/task: W06
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: api
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
