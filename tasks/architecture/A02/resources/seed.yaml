apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: A02
  name: relay-identity
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: A02
  name: relay-reader
  namespace: __NAMESPACE__
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: A02
  name: relay-reader
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: relay-reader
subjects:
- kind: ServiceAccount
  name: relay-identity
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: toolbox
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: A02
  name: toolbox
  namespace: __NAMESPACE__
spec:
  containers:
  - command:
    - sh
    - -c
    - 'trap : TERM INT; sleep 7d & wait'
    image: busybox:1.36
    name: toolbox
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
      requests:
        cpu: 5m
        memory: 8Mi
  terminationGracePeriodSeconds: 0
