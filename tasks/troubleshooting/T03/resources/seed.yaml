apiVersion: v1
kind: Pod
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: T03
  name: sable-worker
  namespace: __NAMESPACE__
spec:
  containers:
  - command:
    - sh
    - -c
    - sleep 7d
    image: busybox:1.36
    name: sleeper
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
  nodeSelector:
    cka-lab.io/nonexistent: 'true'
