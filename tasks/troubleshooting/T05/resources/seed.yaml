apiVersion: v1
kind: Pod
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: T05
  name: dns-stray
  namespace: __NAMESPACE__
spec:
  containers:
  - command:
    - sh
    - -c
    - sleep 7d
    image: busybox:1.36
    name: resolver
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
  dnsConfig:
    nameservers:
    - 192.0.2.53
  dnsPolicy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: T05
  name: web
  namespace: __NAMESPACE__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        cka-lab.io/owner: cka-talos-practice
        cka-lab.io/task: T05
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: web
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    cka-lab.io/owner: cka-talos-practice
    cka-lab.io/task: T05
  name: web
  namespace: __NAMESPACE__
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: web
